<svg viewBox="0 0 800 1100" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <!-- Background -->
  <rect width="800" height="1100" fill="#F0F4FF"/>

  <!-- Header -->
  <rect width="800" height="110" fill="#1A237E"/>
  <text x="400" y="52" fill="white" font-size="30" font-weight="bold" text-anchor="middle">🌐 Be Digitally Smart</text>
  <text x="400" y="82" fill="#90CAF9" font-size="14" text-anchor="middle">A Quick Guide for First-Year Students | VIT Bhopal University</text>
  <text x="400" y="100" fill="#64B5F6" font-size="11" text-anchor="middle">Karthik Malepattu | 25MEI10096 | Integrated M.Tech Cyber Security</text>

  <!-- Section 1: What is Digital Literacy -->
  <rect x="30" y="130" width="740" height="115" rx="12" fill="#FFFFFF" stroke="#3F51B5" stroke-width="2"/>
  <rect x="30" y="130" width="10" height="115" rx="6" fill="#3F51B5"/>
  <text x="60" y="158" fill="#1A237E" font-size="16" font-weight="bold">📖  What is Digital Literacy?</text>
  <text x="60" y="182" fill="#333" font-size="12">The ability to find, evaluate, create, and communicate information using digital technologies —</text>
  <text x="60" y="200" fill="#333" font-size="12">not just using a phone or laptop, but knowing WHY and WHEN to use each tool responsibly.</text>
  <rect x="60" y="212" width="165" height="24" rx="5" fill="#E8EAF6"/>
  <text x="142" y="228" fill="#3F51B5" font-size="11" text-anchor="middle" font-weight="bold">🔍 Find Information</text>
  <rect x="240" y="212" width="165" height="24" rx="5" fill="#E8EAF6"/>
  <text x="322" y="228" fill="#3F51B5" font-size="11" text-anchor="middle" font-weight="bold">✏️ Create Content</text>
  <rect x="420" y="212" width="165" height="24" rx="5" fill="#E8EAF6"/>
  <text x="502" y="228" fill="#3F51B5" font-size="11" text-anchor="middle" font-weight="bold">🛡️ Stay Safe Online</text>
  <rect x="600" y="212" width="160" height="24" rx="5" fill="#E8EAF6"/>
  <text x="680" y="228" fill="#3F51B5" font-size="11" text-anchor="middle" font-weight="bold">🤝 Communicate Well</text>

  <!-- Section 2: Useful Tools -->
  <rect x="30" y="260" width="740" height="145" rx="12" fill="#FFFFFF" stroke="#00897B" stroke-width="2"/>
  <rect x="30" y="260" width="10" height="145" rx="6" fill="#00897B"/>
  <text x="60" y="288" fill="#004D40" font-size="16" font-weight="bold">🛠️  Useful Digital Tools for Students</text>

  <!-- Learning column -->
  <rect x="60" y="298" width="215" height="95" rx="8" fill="#E0F2F1"/>
  <text x="167" y="318" fill="#00695C" font-size="12" font-weight="bold" text-anchor="middle">📚 Learning</text>
  <text x="75" y="338" fill="#333" font-size="11">• Google Scholar</text>
  <text x="75" y="355" fill="#333" font-size="11">• NPTEL / Coursera</text>
  <text x="75" y="372" fill="#333" font-size="11">• YouTube (MIT / Stanford channels)</text>
  <text x="75" y="389" fill="#333" font-size="11">• Notion for notes</text>

  <!-- Productivity column -->
  <rect x="292" y="298" width="215" height="95" rx="8" fill="#E0F2F1"/>
  <text x="399" y="318" fill="#00695C" font-size="12" font-weight="bold" text-anchor="middle">⚡ Productivity</text>
  <text x="307" y="338" fill="#333" font-size="11">• Google Docs / Sheets</text>
  <text x="307" y="355" fill="#333" font-size="11">• Grammarly</text>
  <text x="307" y="372" fill="#333" font-size="11">• Canva for visuals</text>
  <text x="307" y="389" fill="#333" font-size="11">• Google Calendar</text>

  <!-- Career column -->
  <rect x="524" y="298" width="236" height="95" rx="8" fill="#E0F2F1"/>
  <text x="642" y="318" fill="#00695C" font-size="12" font-weight="bold" text-anchor="middle">🚀 Career Growth</text>
  <text x="539" y="338" fill="#333" font-size="11">• GitHub (code portfolio)</text>
  <text x="539" y="355" fill="#333" font-size="11">• LinkedIn (networking)</text>
  <text x="539" y="372" fill="#333" font-size="11">• Kaggle (data science)</text>
  <text x="539" y="389" fill="#333" font-size="11">• HackerRank (practice)</text>

  <!-- Section 3: Safe Internet -->
  <rect x="30" y="420" width="740" height="135" rx="12" fill="#FFFFFF" stroke="#E53935" stroke-width="2"/>
  <rect x="30" y="420" width="10" height="135" rx="6" fill="#E53935"/>
  <text x="60" y="448" fill="#B71C1C" font-size="16" font-weight="bold">🛡️  Safe Internet Practices</text>

  <rect x="60" y="458" width="210" height="85" rx="8" fill="#FFEBEE"/>
  <text x="165" y="478" fill="#C62828" font-size="12" font-weight="bold" text-anchor="middle">🔒 Strong Passwords</text>
  <text x="70" y="498" fill="#333" font-size="10">Use 12+ character passwords</text>
  <text x="70" y="514" fill="#333" font-size="10">Mix letters, numbers &amp; symbols</text>
  <text x="70" y="530" fill="#333" font-size="10">Use a password manager (Bitwarden)</text>

  <rect x="290" y="458" width="210" height="85" rx="8" fill="#FFEBEE"/>
  <text x="395" y="478" fill="#C62828" font-size="12" font-weight="bold" text-anchor="middle">📱 Enable 2FA Always</text>
  <text x="300" y="498" fill="#333" font-size="10">Turn on two-factor authentication</text>
  <text x="300" y="514" fill="#333" font-size="10">on all accounts (Gmail, GitHub etc.)</text>
  <text x="300" y="530" fill="#333" font-size="10">Use Authenticator app, not SMS</text>

  <rect x="520" y="458" width="240" height="85" rx="8" fill="#FFEBEE"/>
  <text x="640" y="478" fill="#C62828" font-size="12" font-weight="bold" text-anchor="middle">🚫 Don't Click Unknown Links</text>
  <text x="530" y="498" fill="#333" font-size="10">Verify sender before clicking any link</text>
  <text x="530" y="514" fill="#333" font-size="10">Check URL before entering passwords</text>
  <text x="530" y="530" fill="#333" font-size="10">Report suspicious msgs to 1930</text>

  <!-- Section 4: Professional Presence -->
  <rect x="30" y="570" width="740" height="130" rx="12" fill="#FFFFFF" stroke="#7B1FA2" stroke-width="2"/>
  <rect x="30" y="570" width="10" height="130" rx="6" fill="#7B1FA2"/>
  <text x="60" y="598" fill="#4A148C" font-size="16" font-weight="bold">💼  Professional Online Presence</text>

  <!-- Poor profile -->
  <rect x="60" y="608" width="320" height="82" rx="8" fill="#FCE4EC"/>
  <text x="220" y="626" fill="#880E4F" font-size="12" font-weight="bold" text-anchor="middle">❌ Weak Profile</text>
  <text x="75" y="645" fill="#555" font-size="10">• No profile photo or a casual selfie</text>
  <text x="75" y="660" fill="#555" font-size="10">• Headline: "Student at VIT" (vague)</text>
  <text x="75" y="675" fill="#555" font-size="10">• No skills, no education filled in</text>
  <text x="75" y="688" fill="#555" font-size="10">• Last active: 2 years ago</text>

  <!-- Strong profile -->
  <rect x="400" y="608" width="360" height="82" rx="8" fill="#E8F5E9"/>
  <text x="580" y="626" fill="#1B5E20" font-size="12" font-weight="bold" text-anchor="middle">✅ Strong Profile</text>
  <text x="415" y="645" fill="#333" font-size="10">• Professional photo, clear name</text>
  <text x="415" y="660" fill="#333" font-size="10">• Headline: "B.Tech CS | Aspiring Security Researcher"</text>
  <text x="415" y="675" fill="#333" font-size="10">• Education, skills &amp; GitHub pinned</text>
  <text x="415" y="688" fill="#333" font-size="10">• Active: posts, connections, projects</text>

  <!-- Section 5: Email Etiquette -->
  <rect x="30" y="715" width="740" height="145" rx="12" fill="#FFFFFF" stroke="#F57F17" stroke-width="2"/>
  <rect x="30" y="715" width="10" height="145" rx="6" fill="#F57F17"/>
  <text x="60" y="743" fill="#E65100" font-size="16" font-weight="bold">📧  Email Etiquette – 5 Essential Parts</text>

  <rect x="57" y="753" width="130" height="96" rx="8" fill="#FFF8E1"/>
  <text x="122" y="773" fill="#E65100" font-size="20" text-anchor="middle">📝</text>
  <text x="122" y="793" fill="#BF360C" font-size="11" font-weight="bold" text-anchor="middle">Subject Line</text>
  <text x="122" y="810" fill="#555" font-size="9" text-anchor="middle">Clear &amp; specific</text>
  <text x="122" y="825" fill="#555" font-size="9" text-anchor="middle">"Re: Assignment</text>
  <text x="122" y="840" fill="#555" font-size="9" text-anchor="middle">Deadline – CS101"</text>

  <rect x="203" y="753" width="130" height="96" rx="8" fill="#FFF8E1"/>
  <text x="268" y="773" fill="#E65100" font-size="20" text-anchor="middle">🙏</text>
  <text x="268" y="793" fill="#BF360C" font-size="11" font-weight="bold" text-anchor="middle">Greeting</text>
  <text x="268" y="810" fill="#555" font-size="9" text-anchor="middle">Formal salutation</text>
  <text x="268" y="825" fill="#555" font-size="9" text-anchor="middle">"Dear Prof. Sharma,"</text>
  <text x="268" y="840" fill="#555" font-size="9" text-anchor="middle">Never "Hey!"</text>

  <rect x="349" y="753" width="130" height="96" rx="8" fill="#FFF8E1"/>
  <text x="414" y="773" fill="#E65100" font-size="20" text-anchor="middle">📋</text>
  <text x="414" y="793" fill="#BF360C" font-size="11" font-weight="bold" text-anchor="middle">Body</text>
  <text x="414" y="810" fill="#555" font-size="9" text-anchor="middle">Short, clear,</text>
  <text x="414" y="825" fill="#555" font-size="9" text-anchor="middle">one request only</text>
  <text x="414" y="840" fill="#555" font-size="9" text-anchor="middle">No slang or emojis</text>

  <rect x="495" y="753" width="130" height="96" rx="8" fill="#FFF8E1"/>
  <text x="560" y="773" fill="#E65100" font-size="20" text-anchor="middle">👋</text>
  <text x="560" y="793" fill="#BF360C" font-size="11" font-weight="bold" text-anchor="middle">Sign-off</text>
  <text x="560" y="810" fill="#555" font-size="9" text-anchor="middle">"Regards," or</text>
  <text x="560" y="825" fill="#555" font-size="9" text-anchor="middle">"Sincerely,"</text>
  <text x="560" y="840" fill="#555" font-size="9" text-anchor="middle">Not "bye" or "thx"</text>

  <rect x="641" y="753" width="129" height="96" rx="8" fill="#FFF8E1"/>
  <text x="706" y="773" fill="#E65100" font-size="20" text-anchor="middle">🪪</text>
  <text x="706" y="793" fill="#BF360C" font-size="11" font-weight="bold" text-anchor="middle">Signature</text>
  <text x="706" y="810" fill="#555" font-size="9" text-anchor="middle">Name + Reg No.</text>
  <text x="706" y="825" fill="#555" font-size="9" text-anchor="middle">Branch + Year</text>
  <text x="706" y="840" fill="#555" font-size="9" text-anchor="middle">College email</text>

  <!-- Quick Tip Banner -->
  <rect x="30" y="875" width="740" height="50" rx="10" fill="#1A237E"/>
  <text x="400" y="898" fill="white" font-size="13" font-weight="bold" text-anchor="middle">💡 Quick Tip: Your digital footprint starts NOW. Everything you post online is permanent.</text>
  <text x="400" y="916" fill="#90CAF9" font-size="11" text-anchor="middle">Build it intentionally. Protect it always. Use it to open doors — not close them.</text>

  <!-- Footer -->
  <rect x="0" y="940" width="800" height="60" fill="#E8EAF6"/>
  <text x="400" y="962" fill="#3F51B5" font-size="11" text-anchor="middle" font-weight="bold">🔐 Cybercrime? Report at: cybercrime.gov.in | Helpline: 1930 (24x7)</text>
  <text x="400" y="982" fill="#5C6BC0" font-size="10" text-anchor="middle">Karthik Malepattu | 25MEI10096 | CSE0001 – Digital Literacy | VIT Bhopal University | 2025–26</text>

  <!-- Decorative dots top right -->
  <circle cx="760" cy="25" r="5" fill="#90CAF9" opacity="0.6"/>
  <circle cx="775" cy="15" r="3" fill="#90CAF9" opacity="0.4"/>
  <circle cx="745" cy="15" r="3" fill="#90CAF9" opacity="0.4"/>
</svg>
